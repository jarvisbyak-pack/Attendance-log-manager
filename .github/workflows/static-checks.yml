name: Static application checks

on:
  push:
    branches: [audit/remediation]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
      - name: Check Apps Script JavaScript syntax
        run: |
          for file in *.gs; do
            echo "Checking $file"
            node --check < "$file"
          done
      - name: Validate Apps Script manifest
        run: node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8')); console.log('Manifest JSON valid')"
      - name: Check duplicate HTML IDs and JavaScript DOM references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          const known = new Set(ids);
          const refs = [...js.matchAll(/\$\(['"]([^'"]+)['"]\)/g)].map(m => m[1]);
          const missing = [...new Set(refs.filter(id => !known.has(id)))];
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          console.log('HTML IDs unique; all static JavaScript DOM references exist.');
          NODE
